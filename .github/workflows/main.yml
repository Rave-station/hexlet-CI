name: Node CI

on:
  push:
    branches:
      - main
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 26.x ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # BEGIN
      # Set the project up, run the linter and run the tests.
      - name: Setup pnpm
        uses: pnpm/action-setup@a429065cf87c9db94831196866c7441338827ad1 # 4. 0. 0
        with:
          version: 12.6.0

      - name: Install dependencies and setup project
        run: make setup

      - name: Run linter
        run: make lint

      - name: Run tests
        run: make test
      # END
